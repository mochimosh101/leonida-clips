name: Auto-clip GTA 6 Shorts

on:
  schedule:
    # Slots run at :07/:37 past (GitHub delays top-of-hour runs). 9 slots a day (Pacific, PST), ~10 uploads with the 18+ pair (YouTube's channel cap is ~10/day).
    # Family clips: 7 AM, 8:30, 11:30, 1 PM, 4 PM. Tips/mistakes series: 10 AM, 2:30 PM, 7 PM. 18+: 10 PM.
    # API quota is 100/day, but YouTube also caps uploads per channel (~10/day for this new channel,
    # hit 2026-11-19). The bot stops cleanly when it hits that cap; verifying the channel raises it.
    - cron: "7 15 * * *"
    - cron: "37 16 * * *"
    - cron: "7 18 * * *"   # 10 AM PT, tips series
    - cron: "37 19 * * *"
    - cron: "7 21 * * *"
    - cron: "37 22 * * *"
    - cron: "7 0 * * *"
    - cron: "7 3 * * *"
    - cron: "7 6 * * *"   # the 18+ slot
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the Short but don't upload"
        type: boolean
        default: false
      count:
        description: "How many Shorts to make (blank = config clips_per_run)"
        type: string
        default: ""
      mode:
        description: "family = no naked clips, adult = only naked clips (18+), any = either, series = next tips/mistakes part"
        type: choice
        options: [family, adult, any, series]
        default: family
      clip_id:
        description: "Make specific Twitch clip id(s), comma-separated (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: autoclip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-montserrat

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Run pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          SLOT="${{ github.event.schedule }}"
          if [ -n "$SLOT" ]; then
            # GitHub sometimes starts scheduled runs hours late. Skip stale ones; the backup starter covers the slot.
            read -r M HR _ <<< "$SLOT"
            NOW=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            LATE=$(( (NOW - (HR * 60 + M) + 1440) % 1440 ))
            if [ "$LATE" -gt 40 ]; then echo "Scheduled slot $SLOT started $LATE min late; skipping."; exit 0; fi
          fi
          MODE="${{ inputs.mode || 'family' }}"
          case "${{ github.event.schedule }}" in
            "7 6 * * *") MODE=adult ;;
            "7 18 * * *"|"37 22 * * *"|"7 3 * * *") MODE=series ;;
          esac
          python -m autoclip.main ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.count && format('--count {0}', inputs.count) || '' }} ${{ inputs.clip_id && format('--clip-id {0}', inputs.clip_id) || '' }} --mode "$MODE"

      - name: Keep the rendered Shorts for 7 days
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save posted-clip history
        if: always() && !inputs.dry_run
        run: |
          git config user.name "autoclip-bot"
          git config user.email "autoclip-bot@users.noreply.github.com"
          git add state/posted.json
          if [ -f state/series.json ]; then git add state/series.json; fi
          git diff --cached --quiet || git commit -m "Record posted clips"
          git pull --rebase origin main
          git push
