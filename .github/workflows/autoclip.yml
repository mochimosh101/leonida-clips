name: Auto-clip GTA 6 Shorts

on:
  schedule:
    # 10 slots a day (Pacific, PST). 9 family-friendly, every 90 min from 7 AM to 7 PM. 18+: 10 PM.
    # API upload quota is 100/day (checked in Cloud console 2026-11-18).
    - cron: "0 15 * * *"
    - cron: "30 16 * * *"
    - cron: "0 18 * * *"
    - cron: "30 19 * * *"
    - cron: "0 21 * * *"
    - cron: "30 22 * * *"
    - cron: "0 0 * * *"
    - cron: "30 1 * * *"
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"   # the 18+ slot
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the Short but don't upload"
        type: boolean
        default: false
      count:
        description: "How many Shorts to make (blank = config clips_per_run)"
        type: string
        default: ""
      mode:
        description: "family = no naked clips, adult = only naked clips (18+), any = either"
        type: choice
        options: [family, adult, any]
        default: family
      clip_id:
        description: "Make specific Twitch clip id(s), comma-separated (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: autoclip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-montserrat

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Run pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m autoclip.main ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.count && format('--count {0}', inputs.count) || '' }} ${{ inputs.clip_id && format('--clip-id {0}', inputs.clip_id) || '' }} --mode ${{ github.event.schedule == '0 6 * * *' && 'adult' || inputs.mode || 'family' }}

      - name: Keep the rendered Shorts for 7 days
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save posted-clip history
        if: always() && !inputs.dry_run
        run: |
          git config user.name "autoclip-bot"
          git config user.email "autoclip-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || git commit -m "Record posted clips"
          git pull --rebase origin main
          git push
