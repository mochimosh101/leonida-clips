name: Auto-clip GTA 6 Shorts

on:
  schedule:
    # Slots run at :07/:37 past (GitHub delays top-of-hour runs). 4 Shorts a day (Mochi's "full reset",
    # 2026-11-20): new channels earn reach faster with fewer, more original Shorts. No 18+ slot.
    # Pacific (PST): 8:37 AM family clip, 10:07 AM tips series, 1:07 PM family clip, 7:07 PM tips series.
    - cron: "37 16 * * *"
    - cron: "7 18 * * *"   # tips series
    - cron: "7 21 * * *"
    - cron: "7 3 * * *"    # tips series
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the Short but don't upload"
        type: boolean
        default: false
      count:
        description: "How many Shorts to make (blank = config clips_per_run)"
        type: string
        default: ""
      mode:
        description: "family = no naked clips, adult = only naked clips (18+), any = either, series = next tips/mistakes part"
        type: choice
        options: [family, adult, any, series]
        default: family
      clip_id:
        description: "Make specific Twitch clip id(s), comma-separated (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: autoclip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest history, so a queued run sees clips the run before it just posted

      - uses: actions/setup-python@v6
        id: py311
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-montserrat

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      # Rico's voice (Mochi 2026-11-22): Chatterbox copies Brian but with emotion. Own env so its pinned
      # packages don't clash with the bot's. voice.py falls back to plain Brian if any of this fails.
      - name: Cache Chatterbox env and model
        uses: actions/cache@v5
        with:
          path: |
            ~/cbx
            ~/.cache/cbx-hf
          key: chatterbox-v1-${{ steps.py311.outputs.python-version }}

      - name: Install Chatterbox voice
        continue-on-error: true
        run: |
          if [ ! -x ~/cbx/bin/python ]; then
            "${{ steps.py311.outputs.python-path }}" -m venv ~/cbx
            ~/cbx/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          fi
          echo "CHATTERBOX_PYTHON=$HOME/cbx/bin/python" >> "$GITHUB_ENV"

      - name: Run pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          SLOT="${{ github.event.schedule }}"
          if [ -n "$SLOT" ]; then
            # GitHub sometimes starts scheduled runs hours late. Skip stale ones; the backup starter covers the slot.
            read -r M HR _ <<< "$SLOT"
            NOW=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            LATE=$(( (NOW - (HR * 60 + M) + 1440) % 1440 ))
            if [ "$LATE" -gt 15 ]; then echo "Scheduled slot $SLOT started $LATE min late; skipping."; exit 0; fi
          fi
          MODE="${{ inputs.mode || 'family' }}"
          case "${{ github.event.schedule }}" in
            "7 18 * * *"|"37 22 * * *"|"7 3 * * *") MODE=series ;;
          esac
          python -m autoclip.main ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.count && format('--count {0}', inputs.count) || '' }} ${{ inputs.clip_id && format('--clip-id {0}', inputs.clip_id) || '' }} --mode "$MODE"

      - name: Keep the rendered Shorts for 7 days
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save posted-clip history
        if: always() && !inputs.dry_run
        run: |
          git config user.name "autoclip-bot"
          git config user.email "autoclip-bot@users.noreply.github.com"
          git add state/posted.json
          if [ -f state/series.json ]; then git add state/series.json; fi
          git diff --cached --quiet || git commit -m "Record posted clips"
          git pull --rebase origin main
          git push
