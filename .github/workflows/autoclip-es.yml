name: Auto-clip GTA 6 Shorts (Spanish)

on:
  schedule:
    # 6 family-friendly Spanish Shorts a day, timed for Mexico/Latin America and Spain.
    # Times in UTC (Pacific = UTC-8): 4:15 AM, 7:15 AM, 10:15 AM, 12:45 PM, 3:15 PM, 6:15 PM Pacific.
    # Minutes are :15/:45 so they never start at the same moment as the English channel's runs.
    - cron: "15 12 * * *"   # Spain 1 PM
    - cron: "15 15 * * *"   # Spain 4 PM, Mexico 9 AM
    - cron: "15 18 * * *"   # Spain 7 PM, Mexico noon (CDMX)
    - cron: "45 20 * * *"   # Spain 9:45 PM, Mexico 2:45 PM
    - cron: "15 23 * * *"   # Mexico 5 PM
    - cron: "15 2 * * *"    # Mexico 8 PM
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the Short but don't upload"
        type: boolean
        default: false
      count:
        description: "How many Shorts to make (blank = config clips_per_run)"
        type: string
        default: ""
      clip_id:
        description: "Make specific Twitch clip id(s), comma-separated (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: autoclip-es
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-montserrat

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Run pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_ES || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_ES || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ES }}  # the Spanish channel's sign-in
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "Spanish channel not connected yet (secret YOUTUBE_REFRESH_TOKEN_ES is missing). Skipping."
            exit 0
          fi
          python -m autoclip.main --config config.es.yaml ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.count && format('--count {0}', inputs.count) || '' }} ${{ inputs.clip_id && format('--clip-id {0}', inputs.clip_id) || '' }} --mode family

      - name: Keep the rendered Shorts for 7 days
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-es-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save posted-clip history
        if: always() && !inputs.dry_run
        run: |
          git config user.name "autoclip-bot"
          git config user.email "autoclip-bot@users.noreply.github.com"
          git add state/posted-es.json
          git diff --cached --quiet || git commit -m "Record posted Spanish clips"
          git pull --rebase origin main
          git push
