# SPANISH channel settings (used by .github/workflows/autoclip-es.yml with --config config.es.yaml).
# Same bot as config.yaml, but Spanish-speaking GTA VI streams, a Spanish voice and Spanish host lines.

game_name: "Grand Theft Auto VI"   # exact Twitch category name
clips_per_run: 1                   # the GitHub schedule runs 10x a day (9 family + 1 18+), so 1 = 10 Shorts/day
lookback_hours: 24                 # only consider clips created in this window
min_views: 150                     # skip low-traction clips
max_duration_s: 55                 # Shorts sweet spot; longer clips are trimmed
languages: ["es"]                  # Spanish-speaking streams only (Rubius, etc.)
state_file: "state/posted-es.json" # separate history so the two channels never block each other
whisper_language: "es"

# Copyright safety. Reposting a streamer without permission can earn strikes
# (3 strikes in 90 days deletes the channel). Best practice: list streamers who
# allow clipping (many run clipping programs) and set allow_any_broadcaster: false.
allow_any_broadcaster: true
broadcaster_allowlist: []          # Twitch logins, e.g. ["streamer_one", "streamer_two"]
broadcaster_blocklist: []          # never clip these

# Rico Neon, the channel's AI host
host:
  name: "Rico Neon"
  voice_engine: "edge"             # "edge" (free) or "elevenlabs" (needs ELEVENLABS_API_KEY + voice id)
  edge_voice: "es-MX-JorgeNeural"  # Mexican Spanish male voice; neutral for Latin America
  edge_rate: "+0%"
  edge_pitch: "+0Hz"              # pitch shifts make it sound robotic
  elevenlabs_voice_id: ""
  avatar_path: "assets/rico.png"   # optional transparent PNG; skipped if missing

writer_model: "claude-opus-5-5"
writer_language: >-
  This Short is for the Spanish-language sister channel. Write hook_line, verdict_line,
  on_screen_hook, title, description and tags in natural, casual Latin American Spanish
  (neutral, understandable in Mexico and Spain; light slang like "no manches" or "qué locura" is fine,
  no vulgar insults). Rico Neon keeps his name and personality. Translate the style ideas, don't
  translate the English examples word for word. Use "GTA 6" in titles. Tags: mix Spanish search terms
  (e.g. "gta 6 en español", "momentos graciosos gta 6") with "gta 6 clips". hook_style/verdict_style
  codes stay H1-H7 / V1-V6.

# Naked/sexual clips: skip | private (upload private so Mochi can mark 18+) | public
adult_clips: "skip"   # Spanish channel is family-friendly only for now
# options: skip | private | public (uncensored only) | both

youtube:
  # Uploads from a Google Cloud project that hasn't passed YouTube's API audit
  # are forced to private. Leave "private" until the audit is approved, then switch to "public".
  privacy_status: "public"     # YouTube may still force private until the API audit passes
  category_id: "20"                # Gaming
  made_for_kids: false
  base_tags: ["GTA 6", "GTA VI", "GTA 6 en español", "GTA 6 momentos graciosos", "Vice City", "Leonida", "gaming", "shorts"]
  clip_credit: "Clip de {name} en Twitch:"
  description_footer: |
    Los mejores momentos de GTA 6 cada día, en 60 segundos, con Rico Neon.
    No afiliado con Rockstar Games.
    #GTA6 #GTAVI #GTA6EnEspañol #ViceCity #Shorts
